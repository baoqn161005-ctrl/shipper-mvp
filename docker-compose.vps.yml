services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLSERVER_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        if [ "$(/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${SQLSERVER_SA_PASSWORD}" -C -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM ShipperMvpDb.sys.tables WHERE name = 'Users'")" = "1" ]; then
        echo 'Database schema already initialized';
        else
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${SQLSERVER_SA_PASSWORD}" -C -I -b -i /init/init_database.sql;
        fi
    volumes:
      - ./init_database.sql:/init/init_database.sql:ro
    restart: "no"

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ShipperMvpDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-ShipperMvp}
      Jwt__Audience: ${JWT_AUDIENCE:-ShipperMvp.Mobile}
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN to a DNS name pointing to this VPS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend-api
    restart: unless-stopped

volumes:
  sqlserver-data:
  caddy-data:
  caddy-config:
